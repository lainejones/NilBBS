; NilBBS message areas                                   BBS:Config/MsgAreas.cfg
;
; One [TAG] section per area.  The ORDER is the area number and each user's
; last-read pointers are stored by number - add new areas at the END.
;   read / write = minimum security level
;   type = local | echo (FidoNet echomail) | email (private mail - keep one)

; Moderation: the area's sub-ops (subop = ACS, e.g. @Name or Gmods) and the sysop are its
; moderators.  Posts go up at once, except:
;   hold_below = 10   posts by callers below this level wait for a moderator
;   hold_first = 3    a caller's posts wait until 3 of theirs here are approved
; Anyone can report a message (! in the reader); moderators see "M Moderate (n)" on the
; area's message list and are told at logon.

[GENERAL]
name  = General Discussion
read  = 0
write = 10
type  = local

[AMIGA]
name  = Amiga Chat
read  = 0
write = 10
type  = local

[SYSOP]
name  = Sysop Announcements
read  = 0
write = 255
type  = local

[EMAIL]
