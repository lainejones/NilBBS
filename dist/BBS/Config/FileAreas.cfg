; NilBBS file areas                                      BBS:Config/FileAreas.cfg
;
; One [TAG] section per area.  path is any AmigaDOS directory (it can be an
; Aminet mirror on another volume).  Descriptions come from files.bbs in that
; directory:   FILENAME.LHA  description   (indented lines continue it)
;   download / upload = minimum level (255 = sysop only)
;   parent = TAG makes it a sub-area of [TAG] (listed under it; L on the parent lists both)
;   an area with no path is only a heading for its sub-areas

[UPLOADS]
name     = New Uploads
path     = BBS:Files/Uploads
download = 10
upload   = 10

[AMIGA]
name     = Amiga Software
path     = BBS:Files/Amiga
download = 10
upload   = 255
