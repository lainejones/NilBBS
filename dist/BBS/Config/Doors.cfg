; NilBBS doors                                           BBS:Config/Doors.cfg
;
; One [TAG] section per door.  Menus run a door with   door | TAG
; and the "doors" menu command lists every door the caller may use.
;
; type = cli     any AmigaDOS CLI program; its Input()/Output() are the caller
;                (cooked line input by default, SetMode() raw for hotkeys,
;                WaitForChar() works, Open("*") reaches the caller too)
; type = cnetrexx  an ARexx door written for CNet (PFiles): TRANSMIT, SENDSTRING,
;                QUERY, GETCHAR, MAYGETCHAR, PROMPT, GETUSER n, BBSIDENTIFY... are
;                answered by NilBBS on port CNETREXX<node-1>.  After a dropped
;                caller, input commands return ###PANIC (like CNet) and the script
;                gets ONE CTRL-C after panic_grace seconds (default 10) - so games
;                can save and quit instead of hanging the node.
;                transmit_newline = no   only for a script that ends its own lines (CNet
;                                  adds a newline after every TRANSMIT - the default)
;                assign = PFILES: BBS:PFiles   creates the assign the scripts expect
; type = xim     an AmiExpress (/X) XIM door: NilBBS serves AEDoorPort<node-1> and runs
;                "<command> <node-1>" - doors need AEDoor.library in LIBS: (ships with
;                most /X doors).  charset defaults to amiga for these.
; type = cnetc   a CNet C-language PFile: NilBBS becomes the door's CNet port - it builds
;                a byte-exact CNet 4 CPort/PortData from the CNet SDK headers and answers
;                CallHost (PutText, EnterLine, OneKey, ReadFile, SetDoing, ReadAccount...).
;                Hang-up = z->Carrier 0 / z->Dumped 1, like CNet.  cnet_version = 3|4
;                (default 4).  Doors that use cnet.library's database calls need real CNet.
; type = rlogin  hand the caller to a remote door server (BBSLink, DoorParty,
;                a Linux box running DOS doors under dosemu/DOSBox)
; type = telnet  a remote telnet door / BBS
; type = tcp     a raw TCP bridge
;
; Macros:  %n node  %f drop file  %d node drawer  %u handle  %r real name
;          %l level  %t minutes left  %i user number  %p caller IP  %T terminal
;
; dropfile = door.sys | dorinfo1.def | door32.sys | all | none
;            (written to BBS:Nodes/Node<n>/; %f is its path)
; charset  = cp437 (PC doors, ANSI art) | amiga (Amiga-native text, ISO-8859-1)
; amigacsi = yes: the door's 0x9B bytes are Amiga CSI and become ESC [
; arrows8  = yes: the caller's arrow keys arrive as Amiga 0x9B sequences
; rawout   = yes: pass output through untouched (no charset translation)
; single   = yes: one caller at a time (single-player data files)
; maint    = a command nightly maintenance (BBSMaint) runs in the door's
;            directory - a game's daily reset, score purge, and so on
; The door's environment: $BBSNODE $BBSUSER $BBSLEVEL $BBSTIME $BBSTERM $BBSDROP

[GUESS]
name     = Guess the Number (sample door)
type     = cli
command  = Guess DROP="%f"
dir      = BBS:Doors/Guess
dropfile = door.sys
level    = 10

; A remote shell for the sysop: the door runs "NewShell *", which attaches
; a Shell to the caller.  Type EndCLI to come back.
; Remote Shell (sysop only) - OFF by default: anyone who gets a level-255 login
; gets a full AmigaDOS Shell.  Remove the ; marks to turn it on.
;[SHELL]
;name     = Remote Shell (sysop)
;type     = cli
;command  = NewShell *
;dir      = SYS:
;dropfile = none
;charset  = amiga
;level    = 255

; ---- the sample doors: one of each kind, to copy when you add your own --------------
; A CNet-style ARexx door (a script).  Door games for CNet or NilBBS normally live in
; BBS:PFiles/<game>/ - the assign line makes PFILES: point there, as CNet has it.
[HELLO]
name     = Hello (sample ARexx door)
type     = cnetrexx
command  = BBS:Doors/Hello/Hello.rexx
level    = 10

; A CNet C PFile (a compiled program that talks to the BBS through CNet's port).
[CNTEST]
name     = CNet C door test (sample)
type     = cnetc
command  = BBS:Doors/CNTest/CNTest
charset  = cp437
level    = 10

; An AmiExpress XIM door.  Needs AEDoor.library in LIBS: (most /X doors come with it),
; so it's off until you have it: remove the ; marks.
;[XIMTEST]
;name     = AmiExpress door test (sample)
;type     = xim
;command  = BBS:Doors/XIMTest/XIMTest
;level    = 10

; Door games come as their own packages - each has an installer that adds its section
; here (or add it by hand from the package's NilBBS-Doors.cfg).  A game made for one
; caller at a time gets   single = yes   so others are told it's busy until they leave.

; Example remote door server over rlogin (fill in your own details):
; [DOORPARTY]
; name        = DoorParty door network
; type        = rlogin
; host        = localhost
; port        = 513
; rlogin_user = [xx]%u
; rlogin_term = ansi-bbs/115200
; level       = 10
