; NilBBS main configuration                              BBS:Config/NilBBS.cfg
; Lines are  key = value.  ; or # starts a comment.

bbs_name        = My NilBBS
sysop_name      = Sysop
; the board's language: BBS:Text/Language/<name>.lng (English is built in).  Callers can pick
; their own under Your settings (G) and at signup when there is more than one .lng file.
language        = English

; ---- network --------------------------------------------------------------
port            = 23            ; telnet port (NilBBS PORT=2323 overrides)
nodes           = 4             ; simultaneous callers, 1..32
node_command    = BBS:BBSNode

; ---- who may connect (see also Config/IPFilter.cfg) ------------------------
flood_connects     = 5          ; more than this many connects ...
flood_seconds      = 30         ; ... inside this many seconds = auto-ban
flood_ban_minutes  = 60
failed_logins      = 5          ; bad passwords from one address before a ban
failed_ban_minutes = 30
max_login_tries    = 3          ; per call
trap_names         = admin root administrator   ; any address trying these handles is banned for good
deny_message    = \r\nAccess denied.\r\n
ban_message     = \r\nYour address is banned from this system.\r\n
busy_message    = \r\nAll nodes are busy - please call back in a few minutes.\r\n

; ---- users -----------------------------------------------------------------
newuser_allowed = yes
newuser_password =              ; set to require a password to sign up
newuser_level   = 10
validated_level = 0             ; >0: new users wait at newuser_level until the sysop validates them
                                ; (sysop menu V, or BBSConfig Users "Validate user") - then get this level
sysop_level     = 255           ; the first account created becomes sysop
ask_email       = yes
; daily minutes by level:  level:minutes, ...   0 minutes = unlimited
; (2 hours for everyone: with several telnet nodes one caller can't block the line,
;  so there's no need for dial-up era limits; doors get the time left and end with it)
level_minutes   = 0:120,255:0
idle_minutes    = 10

; ---- logon -----------------------------------------------------------------
start_menu        = main
logon_lastcallers = yes
logon_oneliners   = yes
hide_sysop_calls  = yes
hide_calls_level  = 255          ; with hide_sysop_calls: accounts at this level or above stay off last callers
                                 ; (a user's own Hidden flag - sysop menu E / BBSConfig Users - always does)
oneliners_keep    = 50           ; BBSMaint keeps the newest this many one-liners each night (0 = keep all)
logon_bulletins   = yes          ; announce bulletins changed since the last call
logon_voting      = yes          ; announce voting topics the caller hasn't voted on

; ---- access -----------------------------------------------------------------
; Menus, doors, areas and conferences can take an ACS (access condition) as well
; as a level:  L20 = level 20+   FA = flag A   Gstaff = group   @Sysop = that user
; Cmain = in conference MAIN   T10 = 10+ minutes left   !X = not X
; Spaces mean AND, | means OR.  The sysop sets flags, group and credits per user
; (sysop menu E).
vote_add_acs      = S            ; who may add voting topics (S = sysop only)

; ---- finger -----------------------------------------------------------------
finger_port       = 79           ; "finger @bbs" shows who's online; 0 = off
finger_users      = yes          ; "finger name@bbs" shows a profile + plan
finger_realname   = no           ; include real names in profiles

; ---- files ------------------------------------------------------------------
; An archive's own FILE_ID.DIZ is shown as its description (cached in <area>/.diz).
; Read with diz_lha / diz_zip (%a archive, %d directory); new ones - made by a caller
; at upload or by the sysop (sysop menu Z), styled by Text/diz.tmpl - are written
; into the archive with diz_add_lha / diz_add_zip.
diz_lha         = LhA >NIL: -q -m e "%a" FILE_ID.DIZ "%d/"
diz_zip         = UnZip >NIL: -o -j -C "%a" FILE_ID.DIZ -d "%d"
diz_add_lha     = LhA >NIL: -q -m a "%a" FILE_ID.DIZ
diz_add_zip     = Zip >NIL: -q -j "%a" FILE_ID.DIZ
diz_del_lha     = LhA >NIL: -q -m d "%a" FILE_ID.DIZ
diz_del_zip     = Zip >NIL: -q -d "%a" FILE_ID.DIZ
diz_offer_upload = yes           ; offer callers to create a DIZ when an upload has none
; Ratio: callers may download ratio KB for each KB they upload, after a free
; allowance; the sysop can grant extra credits (KB) per user.  0 = no ratio.
; Areas with "free = yes" in FileAreas.cfg never count.
ratio           = 0
ratio_free_kb   = 1024
ratio_exempt    = L100           ; ACS of callers the ratio doesn't apply to

; ---- QWK offline mail (message menu W / U) -----------------------------------
; Packets are archives.  LhA works out of the box on an Amiga; most PC readers
; (MultiMail, OLX, ...) prefer Zip - install Zip/UnZip and swap qwk_pack for the
; Zip line.  Replies (.REP) are unpacked with whichever archiver they were made
; with (Zip files start "PK").  Commands run inside the node's work drawer.
qwk_bbsid       = NILBBS         ; packet name: NILBBS.QWK / NILBBS.REP (8 letters max)
qwk_max         = 500            ; messages per packet
qwk_pack        = LhA >NIL: -q -m a "%a" #?
;qwk_pack       = Zip >NIL: -q -j "%a" #?
qwk_unpack_lha  = LhA >NIL: -q -m x "%a"
qwk_unpack_zip  = UnZip >NIL: -o -q "%a"
qwk_location    = Somewhere, Earth

; ---- nightly maintenance (BBSMaint, the NIGHTLY event in Events.cfg) -----------
; Message bases always lose deleted messages.  These add limits (0 = none);
; MsgAreas.cfg can set purge_days / max_msgs per area.
maint_msg_days  = 0              ; drop messages older than this many days
maint_msg_max   = 0              ; keep at most this many per area
maint_mail_days = 180            ; drop READ private mail older than this
maint_user_days = 0              ; retire callers away this long (0 = never)
maint_user_keep_level = 100      ; ...but never anyone at this level or above
maint_trash_days = 14            ; empty file-area .trash drawers after this
maint_log_kb    = 256            ; logs bigger than this become <log>.old
maint_report    = yes            ; mail the sysop what maintenance did
