; NilBBS conferences                                   BBS:Config/Conferences.cfg
;
; Conferences group message and file areas, the AmiExpress way.  Give an area
; "conf = TAG" (or a comma list) in MsgAreas.cfg / FileAreas.cfg and it only
; shows while the caller is in that conference; areas without a conf line show
; in every conference.  Callers switch with the J (join) command.
;
; While this file has no sections there are no conferences: every area is
; always visible.  Remove the ; marks below to try it.
;
;   name = what callers see
;   acs  = who may join (see "Access conditions" in the README), empty = everyone
;   BBS:Text/conf_<TAG>.ans is shown when someone joins, if it exists.

;[MAIN]
;name = Main Conference
;
;[AMIGA]
;name = Amiga Conference
;
;[STAFF]
;name = Staff Room
;acs  = Gstaff | L100
