# BannedNames.cfg - handles nobody may sign up as (existing users aren't affected).
# One handle or pattern per line; case doesn't matter; * matches anything:
#   *sysop*   blocks Sysop, TheSysop, sysop2 ...      guest   blocks exactly "guest"
# Edit here, in BBSConfig (Banned names), or online: sysop menu [X].
# Bots that try admin/root at the login prompt are handled by trap_names in NilBBS.cfg.
*sysop*
*admin*
moderator
staff
guest
everyone
