; NilBBS FidoNet (FTN) echomail                              BBS:Config/Fido.cfg
; Used by BBSToss and BBSMail.  Echo areas are message areas with  type = echo  and
; an  echotag  in MsgAreas.cfg.  BBS:BBSMail does a whole mail run: BBSToss SCAN (new
; posts -> a packet), a binkp session with the uplink, BBSToss TOSS (what came in).
; Run it from Events.cfg ([MAIL] there).  Another binkp mailer works too: point its
; inbound/outbound at the directories below and run BBS:BBSToss after each session.

address  = 21:4/999            ; your node address (e.g. fsxNet 21:x/y)
uplink   = 21:4/100            ; your hub
password =                      ; packet password agreed with the hub (8 chars max)
inbound  = BBS:Fido/Inbound
outbound = BBS:Fido/Outbound
origin   = An NilBBS system
; unpack = UnZip -o -qq %a -d %d  ; command for ZIP bundles (*.su0 ...): %a archive, %d dir

; BBSMail - the uplink's binkp address and the session password your hub gave you
;binkp_host     = net4.fsxnet.nz:24560   ; host[:port] (port 24554 if left out)
;binkp_password =                        ; left out: the packet password above; none: "-"
;binkp_domain   = fidonet                ; the network's domain for our 5D address
;binkp_timeout  = 120                    ; seconds without a frame before giving up
