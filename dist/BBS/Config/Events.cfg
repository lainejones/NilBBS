; NilBBS events                                            BBS:Config/Events.cfg
;
; The daemon runs these on a schedule.  One [TAG] per event:
;   time      = 03:00          when to run (24-hour clock), or instead
;   every     = 30             every 30 minutes, counted from midnight
;   days      = daily          or the days to run on, e.g.  Mon Wed Fri
;   command   = ...            any AmigaDOS command line
;   exclusive = no             yes: warn callers `warn' minutes ahead, refuse
;   warn      = 5                   new calls, log everyone off, run the command,
;                                   then open again (backups, packing the bases)
; Output goes to BBS:Logs/Event-<TAG>.log.  ARexx "EVENT <TAG>" (port NILBBS)
; runs one right away; "RELOAD" re-reads this file.

; Nightly maintenance: packs the message bases, rotates logs, empties old
; file-area trash, tidies the nodes, runs every door's "maint" command, and
; mails the sysop a report.  Callers get a warning, then the BBS closes for
; the few minutes it takes.  Settings: NilBBS.cfg "maintenance" section.
[NIGHTLY]
time      = 04:00
days      = daily
exclusive = yes
warn      = 5
command   = BBS:BBSMaint

; FidoNet mail twice an hour: BBSMail exports new posts, calls the uplink (binkp_host in
; Config/Fido.cfg), and tosses what came in:
;[MAIL]
;every     = 30
;command   = BBS:BBSMail

; A nightly backup with everyone off:
;[BACKUP]
;time      = 04:00
;days      = daily
;exclusive = yes
;warn      = 5
;command   = Copy BBS:Data ALL CLONE QUIET TO Work:BBSBackup/Data
