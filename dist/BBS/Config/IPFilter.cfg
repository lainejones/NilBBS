; NilBBS IP filter                                       BBS:Config/IPFilter.cfg
;
; Checked for every incoming connection, before a node is used:
;   1. "allow" lines are a whitelist - a match skips the deny rules, bans and
;      flood/failed-login auto-banning.  Put your own LAN here.
;   2. "deny" lines block addresses permanently.
;   3. With "default deny", only allowed addresses get in (a private board).
; Dynamic bans (BBSCtl BAN, the sysop menu, auto-bans) live in Data/Bans.dat.
;
; Forms:  1.2.3.4   1.2.3.0/24   1.2.*.*   1.2.*
; After editing:  BBSCtl RELOAD   (or the sysop menu's Reload)

default allow

allow 127.0.0.1
allow 192.168.0.0/16
allow 10.0.0.0/8

; deny 203.0.113.0/24
