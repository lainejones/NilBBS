; NilBBS bulletins                                       BBS:Config/Bulletins.cfg
;
; One [TAG] per bulletin, listed in this order:
;   name = the title in the bulletin list
;   file = the screen in BBS:Text (no extension: .ans/.asc/.txt are tried)
;   acs  = who may read it (optional)
; A bulletin whose file changed since a caller's last call is marked NEW and
; announced at logon (logon_bulletins in NilBBS.cfg).

[RULES]
name = System rules
file = Bulletins/rules
