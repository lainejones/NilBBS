# StripAds.cfg - files other boards slipped into archives as adverts ("uploaded at XYZ BBS").
# NilBBS takes them out of LHA/LZH archives as they're uploaded or imported, and
# "BBSMaint STRIPADS" cleans the files already here.  Only files at the top of an archive
# are touched (never inside the program's own drawers), FILE_ID.DIZ never, and the archive
# keeps its date.  One name or AmigaDOS pattern per line (#? = anything), case doesn't matter.
# Edit here or in BBSConfig (Stripped ads).  Turn it off: NilBBS.cfg strip_ads = no.
UKLamers96
